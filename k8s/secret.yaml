# Example only: create the real one with `kubectl create secret generic sancus-secrets ...`
# or your secrets manager, and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: sancus-secrets
  namespace: sancus
type: Opaque
stringData:
  REDIS_URL: redis://redis.default.svc.cluster.local:6379
  ADMIN_TOKEN: change-me
  # ALERT_WEBHOOK_URL: https://hooks.slack.com/services/...

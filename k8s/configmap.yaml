# Non-secret settings. Secrets (URLs with credentials, tokens) go in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sancus-env
  namespace: sancus
data:
  PORT: "3000"
  LOG_LEVEL: info
  ALLOWED_ORIGINS: https://app.example.com
  TRUST_PROXY: loopback, linklocal, uniquelocal   # your ingress/LB address space
  KEEP_ALIVE_TIMEOUT_MS: "125000"                # must exceed the LB idle timeout
  CONFIG_WATCH: "false"                          # configs come from the image / a mounted volume
  YOUR_SERVICE_HOST: http://your-service.default.svc.cluster.local
  AUTH_URL: http://auth.default.svc.cluster.local
